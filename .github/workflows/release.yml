name: Release

# Manual only. The version is not bumped here: bump it in package.json and add its
# CHANGELOG section through a normal pull request, then run this. That keeps the
# release reviewable and means this workflow never has to push to a protected branch.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only. No tag, no release, no publish.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # Lets npm sign a provenance statement linking the tarball to this run.
      id-token: write
    steps:
      - name: Refuse to release from anywhere but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases run from main only. This ref is ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v7
        with:
          # Tags are needed to tell whether this version was already released.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Read the version being released
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Refuse to reuse a version
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists. npm versions cannot be reused; bump the version first."
            exit 1
          fi

      - name: Require a changelog entry
        run: |
          version="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Add one before releasing."
            exit 1
          fi

      - name: Extract the release notes
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          {
            echo 'notes<<REGEX_KIT_NOTES_EOF'
            awk -v v="## [$version]" '
              index($0, v) == 1 { found = 1; next }
              found && /^## \[/   { exit }
              found               { print }
            ' CHANGELOG.md
            echo 'REGEX_KIT_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Verify
        run: npm run check

      - name: Pack
        run: npm pack --ignore-scripts

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: regex-kit-${{ steps.version.outputs.version }}
          path: '*.tgz'
          if-no-files-found: error

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: |
          echo "### Dry run complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version \`${{ steps.version.outputs.version }}\` builds, verifies and packs." >> "$GITHUB_STEP_SUMMARY"
          echo "No tag, release or publish happened. The tarball is attached as an artifact." >> "$GITHUB_STEP_SUMMARY"

      # Publishing is the only step that cannot be undone, so it goes first. A failed
      # publish then leaves no tag or release behind to clean up.
      - name: Publish to npm
        if: '!inputs.dry_run'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set in the 'release' environment."
            exit 1
          fi
          npm publish --provenance --access public

      - name: Tag the release
        if: '!inputs.dry_run'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "${{ steps.version.outputs.tag }}" -m "regex-kit ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create the GitHub release
        if: '!inputs.dry_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            *.tgz \
            --title "regex-kit ${{ steps.version.outputs.version }}" \
            --notes "${{ steps.notes.outputs.notes }}" \
            --verify-tag

      - name: Summary
        if: '!inputs.dry_run'
        run: |
          {
            echo "### regex-kit ${{ steps.version.outputs.version }} released"
            echo ""
            echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
            echo "- npm: \`@henzyd/regex-kit@${{ steps.version.outputs.version }}\`"
            echo ""
            echo "Remember to move the \`## [Unreleased]\` heading forward in CHANGELOG.md."
          } >> "$GITHUB_STEP_SUMMARY"
